server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required because the proxy_pass directives below use a variable
    # for the upstream host: with a literal hostname nginx resolves it once at startup and
    # caches the address forever, so rebuilding a backend container gave it a new IP and every
    # proxied request returned 502 until nginx itself was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Index builds and large embedding batches take well over the 60s default.
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Control plane. The rewrite is what lets proxy_pass take a variable: with a variable
    # upstream nginx no longer substitutes the location prefix automatically, so the target
    # path has to be built explicitly.
    location /api/ {
        set $upstream_control control-plane;
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream_control:8080;
    }

    # Worker
    location /worker-api/ {
        set $upstream_worker worker;
        rewrite ^/worker-api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream_worker:8081;
    }

    # Search service
    location /search-api/ {
        set $upstream_search search-service;
        rewrite ^/search-api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream_search:8083;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
