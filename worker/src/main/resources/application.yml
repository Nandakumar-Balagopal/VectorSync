spring:
  application:
    name: ${APP_NAME:vectorsync-worker}
  task:
    scheduling:
      pool:
        # Spring Boot's default is 1, so every @Scheduled method in the worker shares one thread and
        # a long derivation cycle delays whatever is behind it. Only DerivationScheduler is live
        # today -- SyncScheduler is @ConditionalOnProperty with no matchIfMissing and nothing sets
        # it -- so this is headroom rather than a fix for an observed stall, and it is what stops
        # the legacy scheduler from starving derivation the moment someone enables it.
        #
        # This is NOT the derivation concurrency knob. Cycle parallelism is
        # vectorsync.runner.parallelism, which fans out inside one cycle rather than running cycles
        # concurrently; @Scheduled(fixedDelay) never overlaps a method with itself.
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:2}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

worker:
  sync:
    interval: ${WORKER_SYNC_INTERVAL_MS:30000}

embedding:
  provider: ${EMBEDDING_PROVIDER:mock}
  external:
    type: ${EMBEDDING_EXTERNAL_TYPE:gemini}
    api-url: ${EMBEDDING_EXTERNAL_API_URL:}
    batch-api-url: ${EMBEDDING_EXTERNAL_BATCH_API_URL:}
    batch-size: ${EMBEDDING_EXTERNAL_BATCH_SIZE:64}
    api-key: ${EMBEDDING_EXTERNAL_API_KEY:}
    model: ${EMBEDDING_EXTERNAL_MODEL:}
    # Read timeout, now actually applied to the HTTP client. Raised from 10s because a cold
    # start loads the model on the first request and a batch can be large; the goal is to bound
    # the wait so a hung service cannot wedge a thread forever, not to enforce a latency budget.
    timeout-ms: ${EMBEDDING_EXTERNAL_TIMEOUT_MS:120000}
    connect-timeout-ms: ${EMBEDDING_EXTERNAL_CONNECT_TIMEOUT_MS:5000}
    http:
      api-key-header: ${EMBEDDING_EXTERNAL_HTTP_API_KEY_HEADER:}
      api-key-prefix: ${EMBEDDING_EXTERNAL_HTTP_API_KEY_PREFIX:}
      request-template: ${EMBEDDING_EXTERNAL_HTTP_REQUEST_TEMPLATE:}
      response-json-pointer: ${EMBEDDING_EXTERNAL_HTTP_RESPONSE_JSON_POINTER:}
control:
  api:
    url: ${CONTROL_API_URL:http://localhost:8080}
    # The scheduler calls the control plane on its own thread before touching any table, so an
    # unbounded read here stalls every table rather than one.
    timeout-ms: ${CONTROL_API_TIMEOUT_MS:15000}
    connect-timeout-ms: ${CONTROL_API_CONNECT_TIMEOUT_MS:5000}

iceberg:
  catalog:
    type: ${ICEBERG_CATALOG_TYPE:hadoop}
    uri: ${ICEBERG_CATALOG_URI:}
    credential: ${ICEBERG_CATALOG_CREDENTIAL:}
    name: ${ICEBERG_CATALOG_NAME:}
    # HadoopCatalog cannot commit atomically on object storage, so a shared
    # deployment must use rest, hive, glue or nessie. This compose stack is a
    # single writer against local MinIO, which is the one case where it is safe.
    allow-unsafe-hadoop: ${ICEBERG_CATALOG_ALLOW_UNSAFE_HADOOP:false}
    warehouse: ${ICEBERG_CATALOG_WAREHOUSE:}
  vector:
    namespace: ${ICEBERG_VECTOR_NAMESPACE:vector}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:true}
    region: ${AWS_REGION:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io:
      vectorsync: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}

management:
  endpoints:
    web:
      exposure:
        # Explicit allowlist. Boot exposes only health by default, which is why /actuator/metrics
        # has been unreachable in every deployment despite actuator being on the classpath since
        # the beginning -- the meters were being collected and nothing could read them.
        #
        # 'metrics' and not a Prometheus scrape endpoint: micrometer-registry-prometheus is not
        # resolvable at the version this build's BOM manages, so adding it breaks offline builds.
        # /actuator/metrics gives the same numbers over JSON and needs no new dependency.
        #
        # Deliberately NOT on a separate management.server.port: docker-compose publishes only the
        # service ports, and the e2e scripts under deployment/ probe health on the main port, so a
        # second port would be both unscrapable and a broken health check.
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
