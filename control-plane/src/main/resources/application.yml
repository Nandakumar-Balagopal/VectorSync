spring:
  application:
    name: ${APP_NAME:vectorsync-control-api}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

iceberg:
  catalog:
    type: ${ICEBERG_CATALOG_TYPE:hadoop}
    warehouse: ${ICEBERG_CATALOG_WAREHOUSE:}
  vector:
    namespace: ${ICEBERG_VECTOR_NAMESPACE:vector}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:true}
    region: ${AWS_REGION:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io:
      vectorsync: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}
