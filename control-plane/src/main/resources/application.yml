spring:
  application:
    name: ${APP_NAME:vectorsync-control-api}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # Adopts a database that predates Flyway (its tables came from ddl-auto) as version 1 rather
    # than trying to re-create them.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Off: Flyway owns the schema. Left at "update" this would silently add columns that no
      # migration records, so environments drift and a correctness-path table's shape depends on
      # whichever build last started against the database.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

iceberg:
  catalog:
    type: ${ICEBERG_CATALOG_TYPE:hadoop}
    uri: ${ICEBERG_CATALOG_URI:}
    credential: ${ICEBERG_CATALOG_CREDENTIAL:}
    name: ${ICEBERG_CATALOG_NAME:}
    # HadoopCatalog cannot commit atomically on object storage, so a shared
    # deployment must use rest, hive, glue or nessie. This compose stack is a
    # single writer against local MinIO, which is the one case where it is safe.
    allow-unsafe-hadoop: ${ICEBERG_CATALOG_ALLOW_UNSAFE_HADOOP:false}
    warehouse: ${ICEBERG_CATALOG_WAREHOUSE:}
  vector:
    namespace: ${ICEBERG_VECTOR_NAMESPACE:vector}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:true}
    region: ${AWS_REGION:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io:
      vectorsync: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}
