# Trino's Iceberg connector attaching to the SAME catalog VectorSync writes through.
#
# The type matters and is the whole reason this file exists. Trino's Iceberg connector supports
# hive_metastore, glue, jdbc, rest, nessie and snowflake -- there is deliberately no "hadoop"
# option, so a HadoopCatalog warehouse is unreachable from Trino no matter how it is configured.
# A JDBC catalog over the Postgres this stack already runs is the cheapest catalog both VectorSync
# and Trino can attach to, and it commits with a real compare-and-set rather than a rename.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/vectorsync
iceberg.jdbc-catalog.connection-user=vectorsync
iceberg.jdbc-catalog.connection-password=vectorsync123
iceberg.jdbc-catalog.catalog-name=iceberg-catalog
iceberg.jdbc-catalog.default-warehouse-dir=s3a://vectorsync/warehouse
# Trino does not create the JDBC catalog's own tables; it requires another Iceberg client to have
# initialized them. VectorSync does that on first use, so start the worker against this catalog
# before querying from here.
iceberg.jdbc-catalog.schema-version=V1

# MinIO, reached with path-style addressing over plain HTTP because it is a local container.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123
